[build-system]
requires = [ "setuptools>=68" ]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-filter-server"
version = "0.1.0"
description = "HTTP redaction service for OpenAI Privacy Filter"
requires-python = ">=3.10"

[project.scripts]
privacy-filter-server = "server:main"

[tool.setuptools]
py-modules = [ "server" ]
